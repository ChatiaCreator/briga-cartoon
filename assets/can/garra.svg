<svg xmlns="http://www.w3.org/2000/svg" width="512" height="256" viewBox="0 0 512 256">
  <!-- Label wrapped around the GARRA Energy can (original brand made for this game). -->
  <defs>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0" stop-color="#050505"/><stop offset="0.45" stop-color="#1c1c1c"/>
      <stop offset="0.55" stop-color="#2a2a2a"/><stop offset="1" stop-color="#050505"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- One scratch: a thin curved blade, wide at the top, sharp at the bottom. -->
    <path id="cut" d="M0 0 C 14 30, 18 70, 6 120 L 0 128 C 2 80, -2 40, -14 6 Z"/>
  </defs>
  <rect width="512" height="256" fill="url(#metal)"/>
  <rect width="512" height="10" fill="#9a9a9a"/>
  <rect y="246" width="512" height="10" fill="#9a9a9a"/>
  <!-- Four parallel scratches slashed diagonally (about 50 degrees), like a cat swipe. -->
  <g filter="url(#glow)" fill="#7dff1a" stroke="#e8ff5a" stroke-width="3" stroke-linejoin="round"
     transform="translate(66 92) rotate(-50)">
    <use href="#cut" x="0" y="0"/>
    <use href="#cut" x="34" y="10"/>
    <use href="#cut" x="68" y="16"/>
    <use href="#cut" x="102" y="18"/>
  </g>
  <text x="356" y="118" font-family="Impact, Arial Black, sans-serif" font-size="60" fill="#7dff1a"
        stroke="#e8ff5a" stroke-width="2" filter="url(#glow)" text-anchor="middle" font-style="italic">GARRA</text>
  <rect x="262" y="132" width="176" height="34" rx="6" fill="#7dff1a"/>
  <text x="350" y="158" font-family="Arial Black, Arial, sans-serif" font-size="22" fill="#050505"
        text-anchor="middle" letter-spacing="5">ENERGY</text>
  <text x="350" y="200" font-family="Arial, sans-serif" font-size="15" fill="#bbbbbb" text-anchor="middle"
        letter-spacing="2">ARRANHA O CANSAÇO</text>
</svg>
