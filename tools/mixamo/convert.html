<!doctype html><html><head><meta charset="utf-8"><title>Mixamo → Briga</title>
<script type="importmap">{"imports":{"three":"../../vendor/three/build/three.module.min.js","three/addons/":"../../vendor/three/addons/"}}</script>
</head><body>
<p>Converte animações do Mixamo (.fbx, "Without Skin") para o esqueleto dos lutadores. Usado por tools/mixamo/convert.cjs.</p>
<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const clean = (n) => n.replace(/^mixamorig[:_]?/, '');
// Other rigs: source bone name -> Mixamo bone name (bones not listed keep their name).
const MAPS = {
  // Motifect packs (Hips, Spine1, Spine2, Chest, Neck1, LeftLeg = thigh, LeftShin = shin…)
  motifect: { Spine1: 'Spine', Spine2: 'Spine1', Chest: 'Spine2', Neck1: 'Neck', Neck2: '-', HeadEnd: '-', Jaw: '-',
    LeftEye: '-', RightEye: '-', LeftLeg: 'LeftUpLeg', LeftShin: 'LeftLeg', RightLeg: 'RightUpLeg', RightShin: 'RightLeg',
    LeftHandIndex4: '-', LeftHandMiddle4: '-', LeftHandRing4: '-', LeftHandPinky4: '-',
    RightHandIndex4: '-', RightHandMiddle4: '-', RightHandRing4: '-', RightHandPinky4: '-' },
  // Unreal-style skeleton (Quaternius "Universal Animation Library", CC0): pelvis, spine_01-03,
  // upperarm_l, lowerarm_l, thigh_l, calf_l, ball_l, index_01_l…
  ual: (() => {
    const m = { root: '-', pelvis: 'Hips', spine_01: 'Spine', spine_02: 'Spine1', spine_03: 'Spine2', neck_01: 'Neck', Head: 'Head' };
    for (const [s, S] of [['l', 'Left'], ['r', 'Right']]) {
      Object.assign(m, { [`clavicle_${s}`]: `${S}Shoulder`, [`upperarm_${s}`]: `${S}Arm`, [`lowerarm_${s}`]: `${S}ForeArm`,
        [`hand_${s}`]: `${S}Hand`, [`thigh_${s}`]: `${S}UpLeg`, [`calf_${s}`]: `${S}Leg`, [`foot_${s}`]: `${S}Foot`,
        [`ball_${s}`]: `${S}ToeBase`, [`ball_leaf_${s}`]: `${S}Toe_End` });
      for (const f of ['thumb', 'index', 'middle', 'ring', 'pinky']) {
        const F = f[0].toUpperCase() + f.slice(1);
        for (let k = 1; k <= 3; k++) m[`${f}_0${k}_${s}`] = `${S}Hand${F}${k}`;
        m[`${f}_04_leaf_${s}`] = `${S}Hand${F}4`;
      }
    }
    return m;
  })(),
};
// Files with many clips (the UAL has 43) are loaded once.
const fbxCache = new Map();
const loadFbx = (url) => { if (!fbxCache.has(url)) fbxCache.set(url, new FBXLoader().loadAsync(url)); return fbxCache.get(url); };
let MAP = null;
const rename = (n) => { const c = clean(n); return MAP && MAP[c] ? MAP[c] : c; };
const bonesOf = (root, map = false) => { const m = new Map(); root.traverse((o) => { if (o.isBone || /mixamorig/.test(o.name)) { const k = map ? rename(o.name) : clean(o.name); if (k !== '-' && !m.has(k)) m.set(k, o); } }); return m; };

// Rest pose of the target (the fighters share the same skeleton).
const target = await new GLTFLoader().loadAsync('../models_src/hotmonster.glb');
const tBones = bonesOf(target.scene);

window.inspect = async (url) => {
  const fbx = await new FBXLoader().loadAsync(url);
  const sBones = bonesOf(fbx);
  const out = [];
  for (const n of ['Hips', 'Spine', 'LeftArm', 'LeftForeArm', 'LeftUpLeg', 'LeftLeg', 'RightArm']) {
    const s = sBones.get(n), t = tBones.get(n);
    out.push(`${n}: src q ${s.quaternion.toArray().map((v) => v.toFixed(2))} p ${s.position.toArray().map((v) => v.toFixed(1))} | tgt q ${t.quaternion.toArray().map((v) => v.toFixed(2))} p ${t.position.toArray().map((v) => v.toFixed(3))}`);
  }
  const clip = fbx.animations[0];
  out.push(`clip ${clip.name} ${clip.duration.toFixed(2)}s tracks ${clip.tracks.length}: ${clip.tracks.slice(0, 4).map((t) => t.name).join(' ')}`);
  out.push(`missing in target: ${[...sBones.keys()].filter((k) => !tBones.has(k)).join(',')}`);
  return out.join('\n');
};
// Retarget a Mixamo clip onto the fighters' skeleton. The two rigs share bone names but not
// bone axes, so each bone copies the source's change of WORLD rotation from its rest pose,
// plus a fixed correction that lines up the rest-pose bone directions (T-pose vs A-pose).
// clipName picks one clip of a file that holds several (default: the first).
window.convert = async (url, fps = 30, map = null, clipName = null) => {
  MAP = map ? MAPS[map] : null;
  const fbx = await loadFbx(url);
  const clip = clipName ? fbx.animations.find((a) => a.name === clipName || a.name.endsWith('|' + clipName)) : fbx.animations[0];
  if (!clip) throw new Error(`clip ${clipName} not in ${url}: ${fbx.animations.map((a) => a.name).join(', ')}`);
  const sBones = bonesOf(fbx, true);
  const names = [...tBones.keys()].filter((n) => sBones.has(n));
  const restQ = (map) => { const r = new Map(); for (const [n, b] of map) r.set(n, b.getWorldQuaternion(new THREE.Quaternion())); return r; };
  const restP = (b) => b.getWorldPosition(new THREE.Vector3());
  fbx.updateMatrixWorld(true); target.scene.updateMatrixWorld(true);
  const tRestLocal = new Map([...tBones].map(([n, b]) => [n, [b.quaternion.clone(), b.position.clone()]]));
  const sRestLocal = new Map([...sBones].map(([n, b]) => [n, [b.quaternion.clone(), b.position.clone()]]));
  const sRest = restQ(sBones), tRest = restQ(tBones);
  // Rigs built with another "up" (Unreal's Z-up UAL lies on its back in this Y-up world): M tilts
  // the source's world so its up (hips to head, at rest) matches the target's. Only the tilt: a rig
  // saved standing sideways in its guard (as Blender exports do) is not turned around. Mixamo and
  // Motifect rigs already stand up straight (M stays exactly identity).
  const upOf = (bones) => restP(bones.get('Head')).sub(restP(bones.get('Hips'))).normalize();
  let M = new THREE.Quaternion().setFromUnitVectors(upOf(sBones), upOf(tBones));
  const turned = 2 * Math.acos(Math.min(1, Math.abs(M.w))) > 0.35;
  if (!turned) M = new THREE.Quaternion();
  const Mi = M.clone().invert();
  const restPS = (b) => (turned ? restP(b).applyQuaternion(M) : restP(b)); // source positions, target's frame
  // Correction per bone: rotate the target's rest bone direction onto the source's.
  const corr = new Map();
  for (const n of names) {
    const tb = tBones.get(n), sb = sBones.get(n);
    const tc = tb.children.find((c) => sBones.has(clean(c.name)) && tBones.has(clean(c.name)));
    if (!tc) { corr.set(n, new THREE.Quaternion()); continue; }
    const sc = sBones.get(clean(tc.name));
    if (!sc) { corr.set(n, new THREE.Quaternion()); continue; }
    const dT = restP(tc).sub(restP(tb)).normalize(), dS = restPS(sc).sub(restPS(sb)).normalize();
    corr.set(n, new THREE.Quaternion().setFromUnitVectors(dT, dS));
  }
  // Hips height ratio for the root motion.
  const hipsT = tBones.get('Hips'), hipsS = sBones.get('Hips');
  let scale = restP(hipsT).y / restPS(hipsS).y;
  const hipsRestS = restPS(hipsS), hipsRestT = restP(hipsT);
  // Rigs whose rest hips sit at the origin (Motifect): measure heights from the feet instead,
  // so the clip's standing hips land on the fighter's standing hips.
  if (map) {
    const footY = (m, P) => Math.min(P(m.get('LeftFoot')).y, P(m.get('RightFoot')).y);
    const gS = footY(sBones, restPS), gT = footY(tBones, restP);
    scale = (hipsRestT.y - gT) / (hipsRestS.y - gS);
    hipsRestS.y = gS + (hipsRestT.y - gT) / scale; // the source's standing hips height
    // Rest hips sit at the origin: take the clip's first frame as the standing spot.
    const hp = clip.tracks.find((t) => {
      const { nodeName, propertyName } = THREE.PropertyBinding.parseTrackName(t.name);
      return propertyName === 'position' && rename(nodeName) === 'Hips';
    });
    if (hp && !turned) { hipsRestS.x = hp.values[0]; hipsRestS.z = hp.values[2]; hipsRestS.y = hp.values[1]; }
    if (hp && turned) {
      // The hips track is in its parent's space there: measure the first frame in world space.
      hipsS.position.fromArray(hp.createInterpolant().evaluate(0)); fbx.updateMatrixWorld(true);
      const p0 = restPS(hipsS); hipsRestS.x = p0.x; hipsRestS.z = p0.z; hipsRestS.y = p0.y;
      const [, rp] = sRestLocal.get('Hips'); hipsS.position.copy(rp); fbx.updateMatrixWorld(true);
    }
  }

  const interps = clip.tracks.map((tr) => {
    const { nodeName, propertyName } = THREE.PropertyBinding.parseTrackName(tr.name);
    const k = rename(nodeName);
    return { bone: k === '-' ? null : sBones.get(k), prop: propertyName, it: tr.createInterpolant() };
  }).filter((x) => x.bone && (x.prop === 'quaternion' || x.prop === 'position'));

  // Visit target bones parents-first.
  const order = [];
  target.scene.traverse((o) => { const n = clean(o.name); if (names.includes(n)) order.push(n); });

  const n = Math.max(2, Math.round(clip.duration * fps) + 1);
  const times = [], rot = new Map(names.map((k) => [k, []])), hipsPos = [];
  const q = new THREE.Quaternion(), pq = new THREE.Quaternion();
  for (let i = 0; i < n; i++) {
    const t = Math.min(clip.duration, i / fps);
    times.push(t);
    for (const [k, [rq, rp]] of sRestLocal) { const b = sBones.get(k); b.quaternion.copy(rq); b.position.copy(rp); }
    for (const x of interps) {
      const v = x.it.evaluate(t);
      if (x.prop === 'quaternion') x.bone.quaternion.fromArray(v);
      else if (x.bone === hipsS) x.bone.position.fromArray(v);
    }
    fbx.updateMatrixWorld(true);
    for (const [k, [rq, rp]] of tRestLocal) { const b = tBones.get(k); b.quaternion.copy(rq); b.position.copy(rp); }
    // Hips position: the source's displacement from rest, scaled, in the target's parent space.
    const dp = restPS(hipsS).sub(hipsRestS).multiplyScalar(scale);
    const wp = hipsRestT.clone().add(dp);
    hipsT.position.copy(hipsT.parent.worldToLocal(wp));
    target.scene.updateMatrixWorld(true);
    for (const k of order) {
      const tb = tBones.get(k);
      const Gs = sBones.get(k).getWorldQuaternion(new THREE.Quaternion());
      // Gt = Gs * inv(GsRest) * C * GtRest
      if (turned) q.copy(M).multiply(Gs).multiply(sRest.get(k).clone().invert()).multiply(Mi).multiply(corr.get(k)).multiply(tRest.get(k));
      else q.copy(Gs).multiply(sRest.get(k).clone().invert()).multiply(corr.get(k)).multiply(tRest.get(k));
      tb.parent.getWorldQuaternion(pq);
      tb.quaternion.copy(pq.invert().multiply(q));
      tb.updateMatrixWorld(true);
      rot.get(k).push(...tb.quaternion.toArray());
    }
    hipsPos.push(...hipsT.position.toArray());
  }
  for (const [k, [rq, rp]] of tRestLocal) { const b = tBones.get(k); b.quaternion.copy(rq); b.position.copy(rp); }
  // Back to rest, so the next clip of a cached file starts from the right pose.
  for (const [k, [rq, rp]] of sRestLocal) { const b = sBones.get(k); b.quaternion.copy(rq); b.position.copy(rp); }
  fbx.updateMatrixWorld(true);
  return { duration: clip.duration, times, rot: Object.fromEntries(rot), hipsPos };
};
window.ready = true;
</script></body></html>
